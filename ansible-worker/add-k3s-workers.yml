---
- name: Добавление worker-нод в кластер K3s
  hosts: k3s_workers
  become: yes
  gather_facts: yes
  vars_files:
    - secrets.yml
  vars:

    k3s_server_url: "https://192.168.1.117:6443" 
    k3s_install_script_url: "https://get.k3s.io"

  tasks:
    - name: Проверить, что переменные сервера и токена заданы
      ansible.builtin.assert:
        that:
          - k3s_server_url is defined and k3s_server_url | length > 0
          - k3s_token is defined and k3s_token | length > 0
        fail_msg: "Задайте k3s_server_url и k3s_token в vars/secrets.yml."

    - name: Отключить swap (требование K3s)
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Удалить строки swap из /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Установить curl (если ещё нет)
      ansible.builtin.package:
        name: curl
        state: present

    - name: Установить K3s agent и подключить к кластеру
      ansible.builtin.shell: |
        curl -sfL {{ k3s_install_script_url }} | \
        K3S_URL="{{ k3s_server_url }}" \
        K3S_TOKEN="{{ k3s_token }}" \
        sh -
      args:
        creates: /usr/local/bin/k3s
      register: k3s_agent_install
      no_log: true

    - name: Убедиться, что служба k3s-agent запущена и включена в автозагрузку
      ansible.builtin.systemd:
        name: k3s-agent
        state: started
        enabled: yes

    - name: Вывести результат
      ansible.builtin.debug:
        msg: "Хост {{ inventory_hostname }} успешно подключён к кластеру K3s как worker."
